name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust:
    name: Build & Test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}

      - name: Check formatting
        run: |
          rustup component add rustfmt || true
          cargo fmt --all -- --check

      - name: Run clippy
        run: |
          rustup component add clippy || true
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo build
        run: cargo build --workspace --locked --release

      - name: Cargo test
        run: |
          mkdir -p test-logs
          cargo test --workspace --locked | tee test-logs/cargo-test.log

      - name: Upload Rust artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rust-target
          path: target/release/

      - name: Upload Rust test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-logs
          path: test-logs/

      - name: Upload Rust artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rust-target
          path: target/release/

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Enable corepack (pnpm)
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Dashboard: install & build
        working-directory: apps/dashboard
        run: |
          pnpm install
          pnpm build
          pnpm test --if-present

      - name: Frontend: install & build
        working-directory: frontend
        run: |
          pnpm install
          pnpm build
          pnpm test --if-present

      - name: Upload frontend artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next/

  security:
    name: Security checks
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Run secret scan script
        run: |
          if [ -f scripts/scan_secrets.py ]; then
            python scripts/scan_secrets.py || true
          else
            echo "No scan_secrets.py found; skipping"
          fi
