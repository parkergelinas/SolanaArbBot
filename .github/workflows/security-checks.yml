name: Security Checks

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * 0' # weekly

jobs:
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
      - name: Install cargo-audit
        run: |
          cargo install cargo-audit --locked
      - name: Install jq
        run: |
          sudo apt-get update && sudo apt-get install -y jq
      - name: Run cargo audit (fail on issues)
        id: cargo_audit
        run: |
          echo "Running cargo audit..."
          cargo audit --json > audit.json || true
          cat audit.json
          # Fail the job if any vulnerabilities with advisory severity >= RUSTSEC-LOW are found
          jq -e '.vulnerabilities.list | length == 0' audit.json || (echo "Vulnerabilities found" && exit 1)
      - name: Upload cargo-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: audit.json

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
      - name: Install cargo-deny
        run: |
          cargo install cargo-deny --locked
      - name: Install jq
        run: |
          sudo apt-get update && sudo apt-get install -y jq
      - name: Run cargo-deny checks (fail on policy violations)
        id: cargo_deny
        run: |
          echo "Running cargo deny..."
          cargo deny check -v --json > deny.json || true
          cat deny.json
          # Fail if there are any diagnostics reported
          jq -e '.diagnostics | length == 0' deny.json || (echo "cargo-deny reported issues" && exit 1)
      - name: Upload cargo-deny report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-deny-report
          path: deny.json
