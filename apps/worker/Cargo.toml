[package]
name = "worker"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "worker"
path = "src/main.rs"

[dependencies]
# ── Workspace crates ──────────────────────────────────────────────────────────
config  = { path = "../../crates/config" }
common  = { path = "../../crates/common" }
events  = { path = "../../crates/events" }
signals = { path = "../../crates/signals" }
scalper     = { path = "../../crates/scalper" }
backtester  = { path = "../../crates/backtester" }
engine      = { path = "../../crates/engine", features = ["prometheus"] }

# ── Async runtime ─────────────────────────────────────────────────────────────
tokio      = { workspace = true }
tokio-util = { version = "0.7" }

# ── Observability ─────────────────────────────────────────────────────────────
tracing            = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
serde_json         = { workspace = true }

# ── Future integrations (uncomment when ready) ────────────────────────────────
# control-api = { path = "../../apps/control-api" }
