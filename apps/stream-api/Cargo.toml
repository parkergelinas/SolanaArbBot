[package]
name        = "stream-api"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "stream-api"
path = "src/main.rs"

[dependencies]
data-layer  = { path = "../../backend/data-layer" }
signal-bus  = { path = "../../crates/signal-bus" }
config      = { path = "../../crates/config" }
signals     = { path = "../../crates/signals" }
ingestion   = { path = "../../crates/ingestion" }
ratelimit   = { path = "../../crates/ratelimit" }
events      = { path = "../../crates/events" }
pricing     = { path = "../../crates/pricing" }
axum        = { version = "0.7", features = ["ws", "macros"] }
tower-http  = { version = "0.6", features = ["cors", "trace"] }
tokio       = { version = "1", features = ["full"] }
serde       = { workspace = true }
serde_json  = "1"
dashmap     = "6.2.1"
crossbeam-channel = "0.5"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
reqwest = { workspace = true }

# OpenTelemetry / OTLP tracing (optional — enable with `--features otel`)
opentelemetry = { version = "0.20", optional = true, features = ["rt-tokio", "trace"] }
tracing-opentelemetry = { version = "0.21", optional = true }
opentelemetry-otlp = { version = "0.10", optional = true, features = ["http-proto"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[features]
otel = ["dep:opentelemetry", "dep:tracing-opentelemetry", "dep:opentelemetry-otlp"]
