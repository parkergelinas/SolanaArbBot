[workspace]
resolver = "2"
members = [
    # ── Core library crates ────────────────────────────────────────────────
    "crates/common",

    # ── New architecture crates ────────────────────────────────────────────
    "crates/config",
    "crates/events",
    "crates/ingestion",
    "crates/storage",
    "crates/portfolio",
    "crates/signals",
    "crates/scalper",

    # ── Wallet / key-management ────────────────────────────────────────────
    "crates/wallet",

    # ── Domain crates (unchanged) ──────────────────────────────────────────
    "crates/decoder",
    "crates/graph",
    "crates/pricing",
    "crates/routing",
    "crates/execution",
    "crates/risk",
    "crates/engine",

    # ── Backward-compatible re-export wrappers ─────────────────────────────
    "crates/stream",
    "crates/rpc_client",
    "crates/accounts",
    "crates/risk_engine",
    "crates/position",

    # ── Orchestration layer ────────────────────────────────────────────────
    "crates/orchestrator",

    # ── Application binaries ───────────────────────────────────────────────
    "apps/worker",
    "apps/control-api",
    "apps/hotpath",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
