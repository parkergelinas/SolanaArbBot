# Mainnet profile — live-capable when env guards are set (still dry_run=true here)
#
# Required for live trading (set ALL):
#   SOLANA_ARB_CONFIG=config.mainnet.toml
#   SOLANA_ARB_FEATURES__DRY_RUN=false
#   SOLANA_ARB_FEATURES__ENABLE_LIVE_TRADING=true
#   SOLANA_ARB_CONFIRM_LIVE_TRADING=1
#   SOLANA_ARB_WALLET_KEY=<base58 64-byte secret>
#   CONTROL_API_KEY=<dashboard/control-api auth secret>
#
# Recommended:
#   SOLANA_ARB_RPC__ENDPOINTS='["https://mainnet.helius-rpc.com/?api-key=YOUR_KEY"]'
#   SOLANA_ARB_WALLET__RPC_ENDPOINT=https://mainnet.helius-rpc.com/?api-key=YOUR_KEY
#   JUPITER_API_KEY=<optional>

[data_sources]
jupiter_price  = "https://api.jup.ag/price/v3"
jupiter_swap   = "https://api.jup.ag/swap/v1"
jupiter_tokens = "https://api.jup.ag/tokens/v2"

[rpc]
endpoints = ["https://api.mainnet-beta.solana.com"]
commitment = "confirmed"

[websocket]
endpoints = ["wss://api.mainnet-beta.solana.com"]

[wallet]
rpc_endpoint = "https://api.mainnet-beta.solana.com"
expected_network = "mainnet"
min_sol_balance = 0.05
validate_network_on_start = true

[features]
enable_live_trading = false
dry_run = true

[strategy]
scalp = true
arb = true
quote_arb = true

[quote_arb]
enabled = true
scan_interval_ms = 2000
min_edge_bps = 15
trade_size_usd = 100.0
