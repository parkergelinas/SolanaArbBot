[package]
name = "config"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# Intentionally no workspace crate dependencies.
# config is a base crate; all other crates can depend on it without cycles.
serde = { version = "1.0.228", features = ["derive"] }
# toml 0.5 is used instead of 0.8 to avoid the toml_edit → indexmap 2.14.0
# transitive dependency that requires Rust edition 2024.
toml = { version = "0.5", default-features = false, features = ["indexmap"] }
thiserror = { workspace = true }
tracing = { workspace = true }
