[package]
name        = "signal-bus"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Shared live signal buffer — single source of truth for control-api + stream consumers"

[dependencies]
data-layer = { path = "../../backend/data-layer" }
serde      = { workspace = true }
serde_json = "1"
tokio      = { version = "1", features = ["fs", "io-util", "sync"] }
tracing    = "0.1"

[dev-dependencies]
tempfile = "3"
