[package]
name = "wallet"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# Workspace crates
common = { path = "../common" }
config = { path = "../config" }

# Logging / errors
tracing   = "0.1"
thiserror = { workspace = true }

# Serialization
serde      = { workspace = true }
serde_json = "1"

# Cryptography — use only the features needed (no pkcs8, no fast).
# default-features = false avoids pulling in extra deps transitively.
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "std", "rand_core"] }
rand          = "0.8"

# Memory safety
zeroize = { version = "1", features = ["derive"] }

# Encoding
bs58    = "0.5"
base64  = "0.22"

# Async HTTP JSON-RPC (rustls — avoids openssl in the wallet crate).
reqwest = { workspace = true }

tokio = { version = "1", features = ["full"] }

# ── edition2024 firewall ──────────────────────────────────────────────────────
# Pin every transitive dep that has released an edition2024 build incompatible
# with Cargo 1.83.  Semver ranges used so we still get bugfixes in safe series.
indexmap     = ">=2.0,  <2.14"   # 2.14.0 requires edition2024
base64ct     = ">=1.0,  <1.8"    # 1.8.3  requires edition2024
idna_adapter = ">=1.0,  <1.2"    # 1.2.2  requires edition2024

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
