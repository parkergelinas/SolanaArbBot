[package]
name        = "data-layer"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Solana real-time data layer: ingest → parse → normalize → enrich → route"

[features]
default = []
yellowstone = ["tonic", "prost"]

[dependencies]
tokio       = { version = "1", features = ["full"] }
serde       = { workspace = true }
serde_json  = "1"
dashmap     = "6.2.1"
crossbeam-channel = "0.5"
tracing     = "0.1"
thiserror   = { workspace = true }
anyhow      = "1"

# Optional Yellowstone gRPC (enable with --features yellowstone)
tonic = { version = "0.12", optional = true, features = ["transport"] }
prost = { version = "0.13", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
