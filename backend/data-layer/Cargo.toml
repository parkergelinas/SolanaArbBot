[package]
name        = "data-layer"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Solana real-time data layer: ingest → parse → normalize → enrich → route"

[features]
default = []
# Yellowstone gRPC feature — requires manual dep resolution before enabling.
# yellowstone-grpc-client and yellowstone-grpc-proto v2.0.0 conflict with
# ed25519-dalek >= 2.2 via solana-program → curve25519-dalek v3 → zeroize < 1.4.
# Re-enable once yellowstone-grpc-proto ships a version using solana-sdk >= 2.1.
yellowstone = ["tonic", "prost"]

[dependencies]
tokio       = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde       = { workspace = true }
serde_json  = "1"
dashmap     = "6.2.1"
crossbeam-channel = "0.5"
tracing     = "0.1"
thiserror   = { workspace = true }
anyhow      = "1"
bs58        = "0.5"

# Optional gRPC transport (enable with --features yellowstone)
tonic = { version = "0.12", optional = true, features = ["transport"] }
prost = { version = "0.13", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
