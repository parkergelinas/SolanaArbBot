[package]
name        = "execution-engine"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Low-latency trade execution: signals → strategies → Jupiter → lifecycle"

[[bin]]
name = "execution-engine"
path = "src/main.rs"

[features]
default = []
# Enable live Solana signing + Jito bundle submission.
# Requires OpenSSL to be installed (solana-sdk → solana-secp256r1-program → openssl).
# Build with: cargo build -p execution-engine --features live-signing
live-signing = [
    "dep:wallet",
    "dep:config",
    "dep:solana-sdk",
    "dep:base64",
    "dep:bincode",
    "dep:bs58",
]

[dependencies]
tokio       = { version = "1", features = ["full"] }
reqwest     = { workspace = true }
serde       = { workspace = true }
serde_json  = "1"
dashmap     = "6.2.1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror   = { workspace = true }
anyhow      = "1"
uuid        = { version = "1.11", features = ["v4"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
axum        = { version = "0.7", features = ["macros"] }

# Optional live-signing deps (requires OpenSSL — see [features] above)
wallet      = { path = "../../crates/wallet",              optional = true }
config      = { path = "../../crates/config",              optional = true }
solana-sdk  = { version = "2", default-features = false,   optional = true }
base64      = { version = "0.22",                          optional = true }
bincode     = { version = "1",                             optional = true }
bs58        = { version = "0.5",                           optional = true }


[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
