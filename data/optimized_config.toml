[rpc]
endpoints = [
    "https://api.mainnet-beta.solana.com",
    "https://solana-api.projectserum.com",
]
timeout_ms = 10000
max_retries = 3
commitment = "confirmed"
max_concurrent_requests = 10

[websocket]
endpoints = ["wss://api.mainnet-beta.solana.com"]
reconnect_interval_ms = 1000
ping_interval_ms = 15000
max_reconnect_attempts = 10
receive_timeout_ms = 30000

[retry]
initial_interval_ms = 100
max_interval_ms = 10000
multiplier = 2.0
max_retries = 5
jitter = true

[execution]
max_slippage_bps = 50
priority_fee_lamports = 5000
min_profit_threshold_usd = 0.12
simulation_initial_amount_usd = 250.0
max_input_ratio = 0.25
clmm_slippage_multiplier = 0.35
min_liquidity = 1.0
max_trade_size_usd = 350.0
max_loss_per_trade_usd = 2.0

[risk]
max_position_size_usd = 50.0
max_drawdown_pct = 0.25
daily_loss_limit_pct = 0.05
monthly_loss_limit_pct = 0.15
total_loss_halt_pct = 0.4
daily_pause_secs = 3600
min_liquidity_usd = 1000.0
max_route_slippage = 0.05
max_route_depth = 3
min_price_product = 0.2
max_price_product = 5.0
daily_loss_limit_usd = 50.0
max_open_positions = 10
capital_deployed_pct_max = 0.8

[features]
enable_live_trading = false
enable_risk_engine = true
enable_metrics = false
dry_run = true
enable_jito = false
enable_clmm = true
enable_raydium = true
verbose_pipeline_log = false

[ingestion]
event_channel_capacity = 4096
event_limit = 0
yield_every = 256

[pipeline]
max_events = 0
event_timeout_ms = 100
routing_max_depth = 3
routing_min_liquidity = 1000.0
routing_depth_penalty_bps = 50

[portfolio]
capital_usd = 10000.0
base_position_pct = 0.02
max_position_pct = 0.05
min_position_usd = 1.5

[monitoring]
metrics_port = 9090
enable_prometheus = false
log_level = "info"
json_logs = false

[signal_engine]
whale_threshold_usd = 10000.0
momentum_window_secs = 60
smart_money_min_score = 0.7
signal_min_strength = 0.05
signal_min_confidence = 0.05
cooldown_secs = 3
feature_store_max_age_secs = 300
signal_channel_capacity = 65536

[scalper]
min_pool_tvl_usd = 50000.0
min_volume_5m_usd = 50.0
volatility_floor = 0.0
volatility_ceiling = 10.0
max_slippage_bps = 150.0
mev_haircut_bps = 5.0
max_trades_per_hour_per_asset = 30
max_trades_per_hour_global = 120
trade_cooldown_secs = 20
min_edge_bps = 25.0
base_position_pct = 0.02
strength_scaling_exponent = 1.5
max_position_usd = 350.0
min_position_usd = 250.0
signal_max_age_secs = 30
base_fee_bps = 25
priority_fee_lamports = 100000
take_profit_pct = 0.012
stop_loss_pct = 0.006

[wallet]
keypair_env_var = "SOLANA_ARB_WALLET_KEY"
rpc_endpoint = "https://api.devnet.solana.com"
commitment = "confirmed"
expected_network = "devnet"
min_sol_balance = 0.1
validate_network_on_start = true

[orchestrator]
regression_pnl_threshold_pct = 10.0
regression_drawdown_threshold_pct = 15.0
regression_win_rate_threshold_pct = 5.0
health_check_interval_secs = 30
emergency_stop_on_critical_health = true

[hotpath]
max_pools = 128
decision_budget_us = 50000
min_edge_bps = 20
max_slippage_bps = 50
min_liquidity_usd_x100 = 10000000
momentum_accel_threshold_x1000 = 1100
min_signal_strength_x1000 = 400
prefer_jito = true
max_jito_tip_lamports = 50000
allow_direct_rpc_fallback = true
execution_queue_capacity = 256
paper_mode = true

[strategy]
scalp = true
arb = true
quote_arb = false
whale_copy = false
momentum = false
sniper = false
liquidation = false

[data_sources]
helius_api_key = ""
jupiter_price = "https://api.jup.ag/price/v3"
